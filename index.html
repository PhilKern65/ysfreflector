<!DOCTYPE html>
<!--
==================================================
KernWi-Fi YSF Dashboard
Revision: 1.7.2
Date: 19 May 2026

Changes:
- TX row background highlight
- Bold TX user
- Spacing polish
- Footer link styling using .status-link
==================================================
-->

<html>
<head>
<meta charset="UTF-8">
<title>KernWi-Fi YSF Network</title>

<link rel="icon" href="/favicon.ico" type="image/x-icon">

<style>
body {
  background: #0a0f1a;
  color: #e6edf3;
  font-family: Arial;
  margin: 0;
  padding-top: 70px;
  padding-bottom: 50px;
}

/* TOP MENU */
.topbar {
  position: fixed;
  top: 0;
  width: 100%;
  background: #111827;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  z-index: 1000;
}

.topbar-left a {
  color: #4da3ff;
  text-decoration: none;
}

.topbar-right {
  margin-left: auto;
  margin-right: 40px;
  display: flex;
  gap: 12px;
  color: #4da3ff;
}

/* CONTENT */
.container {
  max-width: 800px;
  margin: auto;
  padding: 10px;
  text-align: center;
}

.box {
  background: #1c2333;
  padding: 15px;
  margin: 12px 0;
  border-radius: 10px;
}

.status-online { color: #4ade80; }

.status-link {
  color: #4da3ff;
  text-decoration: none;
}

.status-link:hover {
  text-decoration: underline;
}

.tx-live {
  color: red;
  font-weight: bold;
  animation: blink 1s infinite;
}

/* TX ROW */
.tx-row {
  background: rgba(255, 0, 0, 0.08);
  border-radius: 6px;
  padding: 4px 6px;
}

@keyframes blink {
  50% { opacity: 0.3; }
}

/* SPACING */
ul {
  list-style: none;
  padding: 0;
}

ul li {
  margin: 4px 0;
}

/* FOOTER */
.footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #111827;
  padding: 8px;
  font-size: 12px;
  text-align: center;
  color: #aaa;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">

  <div class="topbar-left">
    <a href="https://kernwifi.com.au" target="_blank" class="status-link">
      <strong>KernWi-Fi</strong>
    </a> | YSFReflector Network
  </div>

  <div class="topbar-right">
    <span>📡 YSF</span>
    <span>📶 DMR</span>
    <span>📻 NXDN</span>
  </div>

</div>

<div class="container">

<!-- STATUS -->
<div class="box">
<h3>📊 Status</h3>
<p id="status">
  <span class="status-online">Loading...</span> ·
  at <a href="https://kernwifi.com.au/our-network/" target="_blank" class="status-link">Kern DC</a>
  (Adelaide SA)
</p>
</div>

<!-- TX -->
<div class="box">
<h3>📡 Active Transmission</h3>
<p id="tx">None</p>
</div>

<!-- LAST HEARD -->
<div class="box">
<h3>🕒 Last Heard</h3>
<ul id="heard"></ul>
</div>

<!-- USERS -->
<div class="box">
<h3>👥 Connected Users (<span id="count">0</span>)</h3>
<ul id="users"></ul>
</div>

</div>

<!-- FOOTER -->
<div class="footer">

  <div style="margin-bottom: 4px;">
    💬 Feedback or improvements?
    <a href="https://my2.kernwifi.com.au/client/submitticket.php?step=2&deptid=1"
       target="_blank"
       class="status-link">Click here</a>
  </div>

  © <span id="year"></span> KernWi-Fi Pty Ltd ·
  Ver <span id="version">--</span> ·
  Rev 1.7.2
</div>

<script>

function getFlag(cs) {
  if (cs.startsWith("VK")) return "🇦🇺";
  if (cs.startsWith("W") || cs.startsWith("K") || cs.startsWith("N")) return "🇺🇸";
  if (cs.startsWith("G")) return "🇬🇧";
  return "🌍";
}

async function loadData() {
  try {
    const res = await fetch("/ysf/status.json");
    const data = await res.json();

    // STATUS
    document.querySelector("#status span").innerText = data.status;

    // TX
    if (data.transmitting) {
      document.getElementById("tx").innerHTML =
        '<span class="tx-live">🔴 ' + data.transmitting +
        ' ' + getFlag(data.transmitting) +
        ' — LIVE (' + data.tx_duration + 's)</span>';
    } else {
      document.getElementById("tx").innerText = "No active transmission";
    }

    // LAST HEARD
    let heardHTML = "";

    if (data.last_heard && data.last_heard.length > 0) {

      data.last_heard.forEach(h => {

        let label = h.callsign;

        if (h.callsign === data.local_callsign) label += " ⭐";
        if (h.callsign === data.transmitting) label += " 🔴";

        if (h.callsign === data.transmitting) {
          heardHTML += `<li class="tx-row"><strong>${label} ${getFlag(h.callsign)} — ${h.time}</strong></li>`;
        } else {
          heardHTML += `<li>${label} ${getFlag(h.callsign)} — ${h.time}</li>`;
        }

      });

    } else {
      heardHTML = "<li>No recent activity</li>";
    }

    document.getElementById("heard").innerHTML = heardHTML;

    // USERS
    let html = "";

    if (data.connected_users && data.connected_users.length > 0) {

      data.connected_users.forEach(u => {

        let label = u;

        if (u === data.local_callsign) label += " ⭐";
        if (u === data.transmitting) label += " 🔴";

        if (u === data.transmitting) {
          html += `<li class="tx-row"><strong>${label} ${getFlag(u)}</strong></li>`;
        } else {
          html += `<li>${label} ${getFlag(u)}</li>`;
        }

      });

      document.getElementById("count").innerText = data.connected_users.length;

    } else {
      html = "<li>No users</li>";
      document.getElementById("count").innerText = 0;
    }

    document.getElementById("users").innerHTML = html;

    // FOOTER
    document.getElementById("version").innerText = data.version;
    document.getElementById("year").innerText = new Date().getFullYear();

  } catch (err) {
    console.log(err);
  }
}

loadData();
setInterval(loadData, 2000);

</script>

</body>
</html>
