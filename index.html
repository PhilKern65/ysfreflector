<!DOCTYPE html>
<!--
==================================================
KernWi-Fi YSF Public Dashboard
Revision: 2.8.2
Date: 22 May 2026

Changes:
- Restored LEFT-aligned topbar
- Preserved original header design:
    KernWi‑Fi (link) | YSF Reflector Network
- Retained all functionality from Rev 2.6+

Notes:
- Requires backend Ver 1.17.9
==================================================
-->

<html>
<head>
<meta charset="UTF-8">
<title>YSFReflector Dashboard</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">

<style>
body {
  background: #0a0f1a;
  color: #e6edf3;
  font-family: Arial;
  margin: 0;
  padding-top: 70px;
  padding-bottom: 50px;
}

/* ✅ TOP BAR (LEFT ALIGNED) */
.topbar {
  position: fixed;
  top: 0;
  width: 100%;
  background: #111827;
  padding: 12px 20px;
  font-size: 16px;
  border-bottom: 1px solid #333;
  text-align: left;   /* ✅ KEY FIX */
}

.topbar a {
  color: #60a5fa;
  text-decoration: none;
  font-weight: 600;
}

.topbar a:hover {
  color: #93c5fd;
  text-decoration: underline;
}

.divider {
  margin: 0 8px;
  color: #6b7280;
}

.title {
  font-weight: 500;
}

/* CONTENT */
.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
  text-align: center;
}

.box {
  background: #1c2333;
  padding: 15px;
  margin: 12px 0;
  border-radius: 12px;
}

/* STATUS */
.online { color: #4ade80; }
.active { color: #ef4444; font-weight: bold; }
.idle { color: #fbbf24; }

/* USERS */
.callsign {
  display: block;
  width: 200px;
  margin: 4px auto;
  padding: 6px 10px;
  background: #111827;
  border-radius: 6px;
  text-align: left;
}

/* ACTIVE USER */
.active-user {
  color: #ef4444;
  font-weight: bold;
  border: 1px solid #ef4444;
  background: rgba(239, 68, 68, 0.1);
}

/* LAST HEARD */
#heard div {
  margin: 4px 0;
  font-size: 14px;
  color: #9ca3af;
}

/* FOOTER */
.footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #111827;
  padding: 8px;
  font-size: 12px;
  color: #9ca3af;
  border-top: 1px solid #333;
  text-align: center;
}

.footer a {
  color: #60a5fa;
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
  color: #93c5fd;
}
</style>
</head>

<body>

<!-- ✅ ORIGINAL HEADER RESTORED -->
<div class="topbar">
  <a href="https://kernwifi.com.au" target="_blank">KernWi‑Fi</a>
  <span class="divider">|</span>
  <span class="title">YSF Reflector Network</span>
</div>

<div class="container">

<!-- STATUS -->
<div class="box">
<b>Status:</b> <span id="status">--</span><br>
<b>Connections:</b> <span id="connections">--</span>
</div>

<!-- ACTIVITY -->
<div class="box">
<h3>🔴 Active Transmission</h3>

<div id="tx">--</div>

<hr style="border:1px solid #333; margin:12px 0;">

<h4>📻 Last Heard</h4>
<div id="heard"></div>

</div>

<!-- USERS -->
<div class="box">
<h3>🔗 Connected Users</h3>
<div id="users"></div>
</div>

</div>

<!-- FOOTER -->
<div class="footer">
© 2026 KernWi‑Fi Pty Ltd · Ver <span id="version">--</span> · Rev 2.8.2
&nbsp; | &nbsp;
<a href="https://my2.kernwifi.com.au/client/submitticket.php?step=2&deptid=1" target="_blank">
Feedback / Improvements?
</a>
</div>

<script>

async function loadData() {

  let res = await fetch("/ysf/status.json?ts=" + Date.now());
  let data = await res.json();

  // STATUS
  document.getElementById("status").innerHTML =
    `<span class="online">${data.status}</span>`;

  document.getElementById("connections").innerText = data.connection_count;
  document.getElementById("version").innerText = data.version;

  // TX
  if (data.transmitting) {
    document.getElementById("tx").innerHTML =
      `<span class="active">🔴 ${data.transmitting}</span>`;
  } else if (data.last_heard && data.last_heard.length > 0) {
    let lh = data.last_heard[0];
    document.getElementById("tx").innerHTML =
      `<span class="idle">Last: ${lh.callsign} (${lh.time})</span>`;
  } else {
    document.getElementById("tx").innerHTML =
      `<span class="idle">No recent activity</span>`;
  }

  // USERS
  let usersHTML = "";
  data.connected_users.forEach(u => {

    let cssClass = "callsign";
    let label = u;

    if (data.transmitting && u === data.transmitting) {
      cssClass += " active-user";
      label = "🔴 " + u;
    }

    usersHTML += `<div class="${cssClass}">${label}</div>`;
  });

  document.getElementById("users").innerHTML = usersHTML;

  // LAST HEARD
  let heardHTML = "";
  data.last_heard.forEach(e => {
    heardHTML += `<div>${e.callsign} (${e.time})</div>`;
  });

  document.getElementById("heard").innerHTML = heardHTML;
}

loadData();
setInterval(loadData, 2000);

</script>

</body>
</html>
