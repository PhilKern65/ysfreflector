<!DOCTYPE html>
<!--
==================================================
KernWi-Fi YSF Public Dashboard
Revision: 2.9
Date: 22 May 2026

Changes:
- Simplified UI: unified Activity panel
- Removed duplication between TX and Last Heard
- Cleaner operator-focused layout

Notes:
- Requires backend Ver 1.17.11+
==================================================
-->

<html>
<head>
<meta charset="UTF-8">
<title>YSFReflector Dashboard</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">

<style>
body {
  background: #0a0f1a;
  color: #e6edf3;
  font-family: Arial;
  margin: 0;
  padding-top: 70px;
  padding-bottom: 50px;
}

/* TOP BAR */
.topbar {
  position: fixed;
  top: 0;
  width: 100%;
  background: #111827;
  padding: 12px 20px;
  font-size: 16px;
  border-bottom: 1px solid #333;
  text-align: left;
}

.topbar a {
  color: #60a5fa;
  text-decoration: none;
  font-weight: 600;
}

.topbar a:hover {
  color: #93c5fd;
  text-decoration: underline;
}

.divider {
  margin: 0 8px;
  color: #6b7280;
}

.title {
  font-weight: 500;
}

/* CONTENT */
.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
  text-align: center;
}

.box {
  background: #1c2333;
  padding: 15px;
  margin: 12px 0;
  border-radius: 12px;
}

/* STATUS */
.online { color: #4ade80; }
.active { color: #ef4444; font-weight: bold; }
.idle { color: #fbbf24; }

/* USERS */
.callsign {
  display: block;
  width: 200px;
  margin: 4px auto;
  padding: 6px 10px;
  background: #111827;
  border-radius: 6px;
  text-align: left;
}

/* ACTIVE USER */
.active-user {
  color: #ef4444;
  font-weight: bold;
  border: 1px solid #ef4444;
  background: rgba(239, 68, 68, 0.1);
}

/* ✅ ACTIVITY PANEL */
#activity div {
  margin: 4px 0;
  font-size: 14px;
}

#activity .live {
  color: #ef4444;
  font-weight: bold;
}

/* FOOTER */
.footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #111827;
  padding: 8px;
  font-size: 12px;
  color: #9ca3af;
  border-top: 1px solid #333;
  text-align: center;
}

.footer a {
  color: #60a5fa;
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
  color: #93c5fd;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
  <a href="https://kernwifi.com.au" target="_blank">KernWi‑Fi</a>
  <span class="divider">|</span>
  <span class="title">YSF Reflector Network</span>
</div>

<div class="container">

<!-- STATUS -->
<div class="box">
<b>Status:</b> <span id="status">--</span><br>
<b>Connections:</b> <span id="connections">--</span>
</div>

<!-- ✅ UNIFIED ACTIVITY PANEL -->
<div class="box">
<h3>📻 Activity</h3>
<div id="activity"></div>
</div>

<!-- USERS -->
<div class="box">
<h3>🔗 Connected Users</h3>
<div id="users"></div>
</div>

</div>

<!-- FOOTER -->
<div class="footer" style="margin-top:40px; text-align:center;">
    © 2026 KernWi‑Fi Pty Ltd · Ver <span id="version">--</span> · Rev 1.7.2
    &nbsp; | &nbsp;
    <a href="https://my2.kernwifi.com.au/client/submitticket.php?step=2&deptid=1" class="status-link" target="_blank">
        Feedback & Improvements
    </a>
</div>

<script>

async function loadData() {

  let res = await fetch("/ysf/status.json?ts=" + Date.now());
  let data = await res.json();

  // STATUS
  document.getElementById("status").innerHTML =
    `<span class="online">${data.status}</span>`;

  document.getElementById("connections").innerText = data.connection_count;
  document.getElementById("version").innerText = data.version;

  // ✅ ACTIVITY LOGIC (UNIFIED)
  let activityHTML = "";

  if (data.transmitting) {
    activityHTML += `<div class="live">🔴 ${data.transmitting} (LIVE)</div>`;
  }

  data.last_heard.forEach(e => {
    if (data.transmitting && e.callsign === data.transmitting) return;
    activityHTML += `<div>${e.callsign} (${e.time})</div>`;
  });

  if (activityHTML === "") {
    activityHTML = `<div class="idle">No recent activity</div>`;
  }

  document.getElementById("activity").innerHTML = activityHTML;

  // USERS (highlight active)
  let usersHTML = "";
  data.connected_users.forEach(u => {

    let cssClass = "callsign";
    let label = u;

    if (data.transmitting && u === data.transmitting) {
      cssClass += " active-user";
      label = "🔴 " + u;
    }

    usersHTML += `<div class="${cssClass}">${label}</div>`;
  });

  document.getElementById("users").innerHTML = usersHTML;
}

loadData();
setInterval(loadData, 2000);

</script>

</body>
</html>
