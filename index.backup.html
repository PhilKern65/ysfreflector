<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KernWi-Fi YSF Network</title>

<style>
body {
  background: #0a0f1a;
  color: #e6edf3;
  font-family: Arial;
  margin: 0;
  padding-top: 70px;
  padding-bottom: 50px;
}

/* ✅ TOP MENU */
.topbar {
  position: fixed;
  top: 0;
  width: 100%;
  background: #111827;
  padding: 12px 20px;
  display: flex;
  align-items: center;
}

.topbar-left {
  font-size: 18px;
}

.topbar-right {
  margin-left: auto;
  margin-right: 40px;
  display: flex;
  gap: 12px;
  color: #4da3ff;
}

/* ✅ CONTENT */
.container {
  max-width: 800px;
  margin: auto;
  padding: 10px;
  text-align: center;
}

.box {
  background: #1c2333;
  padding: 15px;
  margin: 10px 0;
  border-radius: 10px;
}

/* ✅ STATUS */
.status-online {
  color: #4ade80;
}

/* ✅ TX animation */
.tx-live {
  color: red;
  font-weight: bold;
  animation: blink 1s infinite;
}

@keyframes blink {
  50% { opacity: 0.3; }
}

/* ✅ LIST */
ul {
  list-style: none;
  padding: 0;
}

/* ✅ FOOTER */
.footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #111827;
  padding: 8px;
  font-size: 12px;
  text-align: center;
  color: #aaa;
}
</style>

</head>

<body>

<!-- ✅ TOP MENU -->
<div class="topbar">

  <div class="topbar-left">
    KernWi-Fi | YSFReflector Network
  </div>

  <div class="topbar-right">
    <span>📡 YSF</span>
    <span>📶 DMR</span>
    <span>📻 NXDN</span>
    <span>📊 Status</span>
    <span>🌍 Map</span>
    <span>🌐 Web</span>
  </div>

</div>

<div class="container">

<!-- ✅ STATUS -->
<div class="box">
<h3>📊 Status</h3>
<p id="status">Loading...</p>
</div>

<!-- ✅ TX -->
<div class="box">
<h3>📡 Active Transmission</h3>
<p id="tx">None</p>
</div>

<!-- ✅ USERS -->
<div class="box">
<h3>👥 Connected Users (<span id="count">0</span>)</h3>
<p>🔗 Active Connections: <span id="connections">0</span></p>
<ul id="users"></ul>
</div>

</div>

<!-- ✅ FOOTER -->
<div class="footer">
© <span id="year"></span> KernWi-Fi Pty Ltd ·
🏷 Version <span id="version">--</span>
</div>

<script>

function getFlag(cs) {
  if (cs.startsWith("VK")) return "🇦🇺";
  if (cs.startsWith("W") || cs.startsWith("K") || cs.startsWith("N")) return "🇺🇸";
  if (cs.startsWith("G")) return "🇬🇧";
  return "🌍";
}

async function loadData() {

  try {
    const res = await fetch("/ysf/status.json");
    const data = await res.json();

    document.getElementById("status").innerHTML =
      '<span class="status-online">' + data.status + '</span>';

    document.getElementById("count").innerText = data.connected_users.length;
    document.getElementById("connections").innerText = data.connection_count;

    // ✅ TX
    if (data.transmitting) {
      document.getElementById("tx").innerHTML =
        '<span class="tx-live">🔴 ' + data.transmitting +
        ' ' + getFlag(data.transmitting) +
        ' — LIVE (' + data.tx_duration + 's)</span>';
    } else {
      document.getElementById("tx").innerText = "No active transmission";
    }

    // ✅ USERS
    let html = "";

    data.connected_users.forEach(u => {
      html += `<li>${u} ${getFlag(u)}</li>`;
    });

    document.getElementById("users").innerHTML = html;

    document.getElementById("version").innerText = data.version;
    document.getElementById("year").innerText = new Date().getFullYear();

  } catch (err) {
    console.log(err);
    document.getElementById("status").innerText = "ERROR";
  }
}

loadData();
setInterval(loadData, 2000);

</script>

</body>
</html>
